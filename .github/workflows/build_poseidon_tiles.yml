name: Build POSEIDON THIRIO internal synthetic map

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poseidon-internal-map-v1
  cancel-in-progress: false

jobs:
  build-poseidon-internal-map:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Build synthetic sea-blue tile pyramid
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, shutil
          from pathlib import Path
          from PIL import Image

          ROOT = Path('poseidon_ea_map')
          TILE = 256
          MAX_Z = 5
          FRAME = 'POSEIDON_LOCAL_OMPHALOS_H0'
          CORE_ID = 'POSEIDON_THIRIO_G_ONLY_V1_20260927'
          MAP_ID = 'POSEIDON_SYNTHETIC_INTERNAL_H0_V1'
          TEMP_OFFSET = 1.5168746082738342
          OMPHALOS_LAT = 38.228646417766356

          def sea_rgb(lon, lat):
              p = math.radians(lat)
              l = math.radians(lon)
              wave1 = 0.5 + 0.5 * math.sin(3*l + 1.8*math.cos(2*p))
              wave2 = 0.5 + 0.5 * math.cos(5*l - 1.2*math.sin(3*p))
              band = 0.5 + 0.5 * math.sin(6*p)
              cloud = 0.28*wave1 + 0.22*wave2 + 0.12*band
              base_r, base_g, base_b = 18, 79, 138
              r = int(min(255, max(0, base_r + 35*cloud)))
              g = int(min(255, max(0, base_g + 55*cloud)))
              b = int(min(255, max(0, base_b + 70*cloud)))
              return r, g, b

          def tile_image(z, x, y):
              nx = 2**(z+1)
              ny = 2**z
              im = Image.new('RGB', (TILE, TILE))
              px = im.load()
              for j in range(TILE):
                  lat = 90 - ((y + (j + 0.5)/TILE) / ny) * 180
                  for i in range(TILE):
                      lon = -180 + ((x + (i + 0.5)/TILE) / nx) * 360
                      px[i, j] = sea_rgb(lon, lat)
              return im

          if ROOT.exists():
              shutil.rmtree(ROOT)
          tiles = ROOT / 'tiles'
          tiles.mkdir(parents=True)

          # build max zoom directly
          z = MAX_Z
          nx = 2**(z+1)
          ny = 2**z
          for x in range(nx):
              col = tiles / str(z) / str(x)
              col.mkdir(parents=True, exist_ok=True)
              for y in range(ny):
                  im = tile_image(z, x, y)
                  im.save(col / f'{y}.webp', 'WEBP', quality=86, method=4)

          # derive lower levels from max zoom
          for z in range(MAX_Z - 1, -1, -1):
              nx = 2**(z+1)
              ny = 2**z
              for x in range(nx):
                  col = tiles / str(z) / str(x)
                  col.mkdir(parents=True, exist_ok=True)
                  for y in range(ny):
                      canvas = Image.new('RGB', (TILE*2, TILE*2))
                      for dx in (0, 1):
                          for dy in (0, 1):
                              child = Image.open(tiles / str(z+1) / str(x*2 + dx) / f'{y*2 + dy}.webp')
                              canvas.paste(child, (dx*TILE, dy*TILE))
                              child.close()
                      im = canvas.resize((TILE, TILE), Image.Resampling.LANCZOS)
                      im.save(col / f'{y}.webp', 'WEBP', quality=86, method=4)

          with Image.open(tiles/'0'/'0'/'0.webp') as left, Image.open(tiles/'0'/'1'/'0.webp') as right:
              prev = Image.new('RGB', (512, 256))
              prev.paste(left, (0, 0))
              prev.paste(right, (256, 0))
              prev.save(ROOT/'preview_full_poseidon.webp', 'WEBP', quality=92, method=4)

          count = sum(1 for _ in tiles.rglob('*.webp'))
          expected = sum(2**(2*z + 1) for z in range(MAX_Z + 1))
          assert count == expected == 2730

          digest = hashlib.sha256((ROOT/'preview_full_poseidon.webp').read_bytes()).hexdigest()
          manifest = {
              'project': 'Ποσειδών / Το Θηρίο',
              'map_id': MAP_ID,
              'core_id': CORE_ID,
              'coordinate_frame': FRAME,
              'coordinate_domain_internal_lon_deg': [-180, 180],
              'coordinate_domain_internal_lat_deg': [-90, 90],
              'H0_reference': 'Θηρίο / Ποσειδών — μεταφερμένος Ναός Ποσειδώνος Σουνίου; H=0 by internal definition',
              'omphalos_G': {
                  'name': 'Το Θηρίο / Ποσειδών',
                  'planetographic_lat_deg': OMPHALOS_LAT,
                  'temporary_transfer_offset_deg': TEMP_OFFSET,
                  'local_omphalos_longitude_deg': 0.0,
                  'local_omphalos_H': 0
              },
              'raster_register': {
                  'purpose': 'visual overlay only',
                  'source_native_lon_deg_at_local_H0': TEMP_OFFSET,
                  'physical_body_fixed_registration_verified': False,
                  'used_to_define_omphalos_or_EA': False,
                  'texture': 'synthetic sea-blue artistic texture'
              },
              'source': {
                  'kind': 'synthetic',
                  'credit': 'Generated in GitHub Actions for internal POSEIDON chart',
                  'sha256': digest
              },
              'validation_markers': [
                  {'name': 'Voyager 2 RO North', 'lat_deg': 62.0, 'lon_deg_local': 35.0, 'note': 'illustrative local-H placement'},
                  {'name': 'Voyager 2 RO South', 'lat_deg': -45.0, 'lon_deg_local': -40.0, 'note': 'illustrative local-H placement'}
              ],
              'tiles': {
                  'directory': 'poseidon_ea_map/tiles',
                  'z_min': 0,
                  'z_max': MAX_Z,
                  'z0_matrix': [2, 1],
                  'max_matrix': [2**(MAX_Z+1), 2**MAX_Z],
                  'tile_size_px': TILE,
                  'format': 'WebP',
                  'tile_count': count
              }
          }
          (ROOT/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'PASS: generated {count} synthetic tiles for POSEIDON internal chart')
          PY

      - name: Verify frame and tile count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('poseidon_ea_map')
          data = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert data['coordinate_frame'] == 'POSEIDON_LOCAL_OMPHALOS_H0'
          assert data['map_id'] == 'POSEIDON_SYNTHETIC_INTERNAL_H0_V1'
          assert data['omphalos_G']['local_omphalos_H'] == 0
          assert data['omphalos_G']['local_omphalos_longitude_deg'] == 0.0
          assert data['tiles']['tile_count'] == 2730
          assert sum(1 for _ in (root/'tiles').rglob('*.webp')) == 2730
          print('PASS: internal Omphalos chart / synthetic tiles / manifest')
          PY

      - name: Commit ONLY new POSEIDON map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A poseidon_ea_map
          if git diff --cached --quiet; then
            echo "Map identical; no commit needed"
          else
            git commit -m "Build POSEIDON THIRIO internal synthetic map V1"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
